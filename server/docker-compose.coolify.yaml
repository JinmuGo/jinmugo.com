services:
  comment-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: /app/data/comments.db
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-https://comment.jinmu.me}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID is required}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET is required}"
      FRONTEND_URL: "${FRONTEND_URL:-https://jinmu.me}"
      PORT: "3001"
    volumes:
      - comment-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  comment-data:
    driver: local
