version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      # 보안 수정은 묶어서 PR 하나로 올린다.
      security:
        applies-to: security-updates
        patterns: ["*"]
      # 일반 업데이트는 major만 따로 두고 minor·patch를 PR 하나로 묶는다.
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
