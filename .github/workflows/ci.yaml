name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  repository_dispatch:
    types: [content-update]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-audit:
    name: Lint & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Environment
        uses: ./.github/actions/common-steps

      - name: Biome Check
        run: pnpm check

      - name: Security Audit
        run: pnpm audit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Environment
        uses: ./.github/actions/common-steps

      - name: Run Tests
        run: pnpm test

  build:
    name: Content, Types & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Environment
        uses: ./.github/actions/common-steps

      - name: Validate Content
        run: pnpm content:doctor

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify Markdown Tables
        run: pnpm verify:tables

      - name: Verify Internal Links
        run: pnpm verify:links

  server:
    name: Server Tests & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.13.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install Server Dependencies
        run: pnpm --dir server install --frozen-lockfile

      - name: Install SQLite CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes sqlite3

      - name: Test Server
        run: pnpm --dir server test

      - name: Smoke Test Production Image
        run: |
          docker build --tag jinmu-comment-server:test server
          container_id="$(docker run --detach --publish 127.0.0.1:3001:3001 \
            --env DATABASE_URL=/app/data/comments.db \
            --env BETTER_AUTH_SECRET=0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-_ \
            --env BETTER_AUTH_URL=https://comment.example.com \
            --env GITHUB_CLIENT_ID=test \
            --env GITHUB_CLIENT_SECRET=test \
            --env FRONTEND_URL=https://example.com \
            jinmu-comment-server:test)"
          trap 'docker rm --force "$container_id" >/dev/null' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1

      - name: Audit Server Dependencies
        run: pnpm --dir server audit
