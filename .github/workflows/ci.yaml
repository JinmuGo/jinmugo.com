name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  repository_dispatch:
    types: [content-update]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-audit:
    name: Lint & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Environment
        uses: ./.github/actions/common-steps

      - name: Biome Check
        run: pnpm check

      - name: Security Audit
        run: pnpm audit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Environment
        uses: ./.github/actions/common-steps

      - name: Run Tests
        run: pnpm test

  build:
    name: Content, Types & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Environment
        uses: ./.github/actions/common-steps

      - name: Validate Content
        run: pnpm content:doctor

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify Markdown Tables
        run: pnpm verify:tables

  server:
    name: Server Build & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.13.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install Server Dependencies
        run: pnpm --dir server --ignore-workspace install --frozen-lockfile

      - name: Build Server
        run: pnpm --dir server --ignore-workspace build

      - name: Audit Server Dependencies
        run: pnpm --dir server --ignore-workspace audit
