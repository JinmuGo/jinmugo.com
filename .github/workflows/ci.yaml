name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  repository_dispatch:
    types: [content-update]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-audit:
    name: Lint & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Environment
        uses: ./.github/actions/common-steps

      - name: Biome Check
        run: pnpm check

      - name: Security Audit
        run: pnpm audit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Environment
        uses: ./.github/actions/common-steps

      - name: Run Tests
        run: pnpm test

  build:
    name: Content, Types & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Environment
        uses: ./.github/actions/common-steps

      - name: Validate Content
        run: pnpm content:doctor

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm astro build

      - name: Verify Markdown Tables
        run: pnpm verify:tables

      - name: Verify Internal Links
        run: pnpm verify:links
