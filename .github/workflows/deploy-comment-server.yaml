name: Deploy Comment Server

on:
  push:
    branches: ["main"]
    paths:
      - "server/**"

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Webhook
        run: |
          curl -sf "${{ secrets.COOLIFY_COMMENT_WEBHOOK }}" || {
            echo "::error::Coolify webhook failed"
            exit 1
          }
