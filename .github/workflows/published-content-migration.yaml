name: Published Content Migration

# Published 블로그 콘텐츠 자동 마이그레이션 워크플로우
# blog_obsidian 디렉토리의 마크다운 파일이 변경되면 draft가 false인 것들만 PocketBase DB에 마이그레이션

on:
  # Runs on completion of CI workflow
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types:
      - completed
  
  workflow_dispatch:
    inputs:
      force_migrate:
        description: "Force migration of all published content"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  BUILD_PATH: "./blog"

jobs:
  detect-changes:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    name: Detect Submodule Changes
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.submodule-changes.outputs.changed }}
      changed-files: ${{ steps.get-changed-files.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          submodules: recursive

      - name: Check submodule changes
        id: submodule-changes
        run: |
          # submodule의 commit hash가 변경되었는지 확인
          if git diff HEAD~1 HEAD --name-only | grep -q "^blog/blog_obsidian$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Submodule blog_obsidian has changed"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No submodule changes detected"
          fi

      - name: Get changed files from submodule
        id: get-changed-files
        if: steps.submodule-changes.outputs.changed == 'true'
        run: |
          cd blog/blog_obsidian
          
          # 이전 commit hash 가져오기
          cd ../..
          PREV_HASH=$(git show HEAD~1:blog/blog_obsidian | head -1 | cut -d' ' -f2)
          CURR_HASH=$(git rev-parse HEAD:blog/blog_obsidian)
          
          echo "Previous hash: $PREV_HASH"
          echo "Current hash: $CURR_HASH"
          
          cd blog/blog_obsidian
          
          # 두 commit 사이의 변경된 .md 파일들 찾기
          CHANGED_FILES=$(git diff --name-only $PREV_HASH $CURR_HASH | grep '\.md$' | head -50)
          
          if [ -n "$CHANGED_FILES" ]; then
            # 파일 경로를 blog/blog_obsidian/ prefix와 함께 출력
            echo "$CHANGED_FILES" | sed 's|^|blog/blog_obsidian/|' > /tmp/changed_files.txt
            FILES=$(cat /tmp/changed_files.txt | tr '\n' ' ')
            echo "files=$FILES" >> $GITHUB_OUTPUT
            echo "Changed markdown files:"
            echo "$FILES"
          else
            echo "files=" >> $GITHUB_OUTPUT
            echo "No markdown files changed"
          fi

  migrate-published-content:
    name: Migrate Published Content to PocketBase DB
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true' || github.event.inputs.force_migrate == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive

      - name: Setup Common Environment
        uses: ./.github/actions/common-steps

      - name: Create API .env file
        run: |
          cat > api/.env << EOF
          PB_URL=${{ secrets.PB_URL }}
          PB_TOKEN=${{ secrets.PB_TOKEN }}
          NODE_ENV=production
          EOF

      - name: Show changed files
        run: |
          echo "Changed files:"
          echo "${{ needs.detect-changes.outputs.changed-files }}"
        if: needs.detect-changes.outputs.has-changes == 'true'

      - name: Migrate published content to PocketBase DB
        run: |
          if [ "${{ needs.detect-changes.outputs.has-changes }}" == "true" ]; then
            echo "${{ needs.detect-changes.outputs.changed-files }}" > changed_files.txt
            pnpm run migrate:changed
          else
            pnpm run migrate:published
          fi
        working-directory: api
        env:
          PB_URL: ${{ secrets.PB_URL }}
          PB_TOKEN: ${{ secrets.PB_TOKEN }}
          NODE_ENV: production
          CHANGED_FILES: ${{ needs.detect-changes.outputs.changed-files }}

      - name: Verify migration
        run: |
          echo "Published content migration completed successfully!"
          echo "Verifying API health and data..."
          # API 서버가 살아있는지 및 데이터 조회 가능한지 확인 (공개된 API 사용)
          if [ -n "${{ secrets.PUBLIC_API_URL }}" ]; then
            curl -f "${{ secrets.PUBLIC_API_URL }}/health" || echo "Warning: Health check failed"
            curl -f "${{ secrets.PUBLIC_API_URL }}/api/posts?limit=1" || echo "Warning: Could not fetch posts"
          else
            echo "Skipping API verification (PUBLIC_API_URL not set)"
          fi
        if: success()


  # PocketBase는 별도 배포가 필요없으므로 Edge Functions 배포 단계 제거 