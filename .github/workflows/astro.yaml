# Sample workflow for building and deploying an Astro site to GitHub Pages
#
# To get started with Astro see: https://docs.astro.build/en/getting-started/
#
name: Deploy Astro site to Pages

on:
  # Runs on completion of CI workflow
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types:
      - completed

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "./apps/blog" # default value when not using subfolders

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive

      - uses: ./.github/actions/common-steps

      - name: Create .env file
        run: |
          cat > .env << EOF
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
          PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}
          GSC_PROPERTY_ID=${{ secrets.GSC_PROPERTY_ID }}
          GSC_SITE_URL=${{ secrets.GSC_SITE_URL }}
          GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          PUBLIC_FIREBASE_API_KEY=${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_FIREBASE_APP_ID=${{ secrets.PUBLIC_FIREBASE_APP_ID }}
          PUBLIC_FIRESTORE_DATABASE_ID=${{ secrets.PUBLIC_FIRESTORE_DATABASE_ID }}
          EOF
        working-directory: ${{ env.BUILD_PATH }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build dependencies
        run: pnpm build --filter=@jinmu/types --filter=@jinmu/utils

      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: .cache/translations
          key: translations-${{ hashFiles('apps/blog/blog_obsidian') }}
          restore-keys: translations-

      - name: Restore cached translations into Obsidian vault
        run: |
          if [ -d ../../.cache/translations ]; then
            echo "Restoring cached translations..."
            find ../../.cache/translations -name "*.en.md" | while read f; do
              REL="${f#../../.cache/translations/}"
              TARGET="blog_obsidian/$REL"
              if [ ! -f "$TARGET" ]; then
                mkdir -p "$(dirname "$TARGET")"
                cp "$f" "$TARGET"
              fi
            done
            echo "Cached translations restored."
          else
            echo "No translation cache found."
          fi
        working-directory: ${{ env.BUILD_PATH }}

      - name: Translate content (Korean → English)
        id: translate
        run: node scripts/translate.js
        working-directory: ${{ env.BUILD_PATH }}
        continue-on-error: true
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: Save translations to cache
        run: |
          mkdir -p ../../.cache/translations
          cd blog_obsidian
          find . -name "*.en.md" -type f | while read f; do
            mkdir -p "../../.cache/translations/$(dirname "$f")"
            cp "$f" "../../.cache/translations/$f"
          done
          TOTAL=$(find ../../.cache/translations -name "*.en.md" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Translation files cached: $TOTAL"
          if [ "${{ steps.translate.outcome }}" = "failure" ]; then
            echo "::warning::Translation step failed. Deploying with existing translations only ($TOTAL files)."
          fi
        working-directory: ${{ env.BUILD_PATH }}

      - name: Prebuild (export Obsidian content)
        run: pnpm prebuild
        working-directory: ${{ env.BUILD_PATH }}

      - name: Build with Astro
        run: |
          pnpm build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
        working-directory: ${{ env.BUILD_PATH }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
