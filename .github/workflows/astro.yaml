name: Deploy Astro site to Pages

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types:
      - completed

  repository_dispatch:
    types: [content-update]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' }}
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: ./.github/actions/common-steps

      - name: Validate required R2 secrets
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          missing=0
          for key in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET_NAME; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Required R2 secrets are missing. Failing build early."
            exit 1
          fi

      - name: Create .env file
        run: |
          cat > .env << EOF
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
          GSC_PROPERTY_ID=${{ secrets.GSC_PROPERTY_ID }}
          GSC_SITE_URL=${{ secrets.GSC_SITE_URL }}
          GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          PUBLIC_COMMENT_API_URL=${{ secrets.PUBLIC_COMMENT_API_URL }}
          EOF

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Restore translation cache
        uses: actions/cache@v5
        with:
          path: .cache/translations
          key: translations-${{ hashFiles('obsidian') }}
          restore-keys: translations-

      - name: Restore cached translations into Obsidian vault
        run: |
          if [ -d .cache/translations ]; then
            echo "Restoring cached translations..."
            restored=0
            skipped_stale=0
            find .cache/translations -name "*.en.md" | while read f; do
              REL="${f#.cache/translations/}"
              TARGET="obsidian/$REL"
              KOREAN_SOURCE="${TARGET%.en.md}.md"
              # Skip stale translations whose Korean source was removed (e.g., post migrated to another collection)
              if [ ! -f "$KOREAN_SOURCE" ]; then
                skipped_stale=$((skipped_stale + 1))
                continue
              fi
              if [ ! -f "$TARGET" ]; then
                mkdir -p "$(dirname "$TARGET")"
                cp "$f" "$TARGET"
                restored=$((restored + 1))
              fi
            done
            echo "Cached translations restored: $restored, skipped stale: $skipped_stale."
          else
            echo "No translation cache found."
          fi

      - name: Validate content frontmatter
        run: pnpm content:doctor

      - name: Translate content (Korean → English)
        id: translate
        run: node scripts/translate.js
        continue-on-error: true
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: Save translations to cache
        run: |
          mkdir -p .cache/translations
          cd obsidian
          find . -name "*.en.md" -type f | while read f; do
            mkdir -p "../.cache/translations/$(dirname "$f")"
            cp "$f" "../.cache/translations/$f"
          done
          TOTAL=$(find ../.cache/translations -name "*.en.md" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Translation files cached: $TOTAL"
          if [ "${{ steps.translate.outcome }}" = "failure" ]; then
            echo "::warning::Translation step failed. Deploying with existing translations only ($TOTAL files)."
          fi

      - name: Prebuild (export Obsidian content)
        run: pnpm prebuild

      - name: Build with Astro
        run: |
          pnpm astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
