name: Deploy Astro site to Pages

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: ./.github/actions/common-steps

      - name: Validate required R2 secrets
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          missing=0
          for key in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET_NAME; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Required R2 secrets are missing. Failing build early."
            exit 1
          fi

      - name: Create .env file
        run: |
          cat > .env << EOF
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
          GSC_PROPERTY_ID=${{ secrets.GSC_PROPERTY_ID }}
          GSC_SITE_URL=${{ secrets.GSC_SITE_URL }}
          GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          PUBLIC_COMMENT_API_URL=${{ secrets.PUBLIC_COMMENT_API_URL }}
          EOF

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Restore translation cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/translations
          key: translations-${{ hashFiles('obsidian/**/*.md', '!obsidian/**/*.en.md', '!obsidian/**/*.en-US.md') }}
          restore-keys: translations-

      - name: Restore cached translations into Obsidian vault
        run: node scripts/translate.js --restore-cache .cache/translations

      - name: Validate content frontmatter
        run: pnpm content:doctor

      - name: Translate content (Korean → English)
        run: node scripts/translate.js
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: Save translations to cache
        run: node scripts/translate.js --save-cache .cache/translations

      - name: Prebuild (export Obsidian content)
        run: pnpm prebuild

      - name: Build with Astro
        run: |
          pnpm astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"

      - name: Verify Markdown tables rendered as HTML
        run: pnpm verify:tables

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
